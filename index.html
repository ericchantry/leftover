#cross .hub::before { transform: translate(-50%, -50%) rotate(45deg); }
#cross .hub::after { transform: translate(-50%, -50%) rotate(-45deg); }
#cross .tri { position: absolute; width: 0; height: 0; border: 7px solid transparent; }
#cross .tri.u { left: 50%; top: 8%; transform: translateX(-50%); border-bottom-color: var(--bone); border-top: 0; }

  fume(x, y, t, f) { const yy = y - 9 + Math.sin(t * 0.08 + (f.seed || 0)) * 2; G.globalAlpha = 0.85; ell(x - 3, yy, 4, 3, '#8aa07a'); ell(x + 3, yy - 1, 4, 3, '#9ab08a'); ell(x, yy - 3, 4, 3, '#aac09a'); G.globalAlpha = 1; px(x - 2, yy - 1, '#2a3a22'); px(x + 2, yy - 1, '#2a3a22'); R(x - 1, yy + 1, 3, 1, '#2a3a22'); },

const ROOMS = {};

function grid(w, h) { return Array.from({ length: h }, () => Array(w).fill('#')); }
function fill(m, x, y, w, h, ch) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (m[j] && m[j][i] !== undefined) m[j][i] = ch; }
function sprinkle(m, ch, n, r, keep) { let k = 0, g = 0; while (k < n && g++ < 2000) { const x = Math.floor(r() * m[0].length), y = Math.floor(r() * m.length); if (m[y][x] === '.' && !(keep && keep(x, y))) { m[y][x] = ch; k++; } } }
function O(id, tx, ty, o) { return Object.assign({ id, x: tx * TS + 8, y: ty * TS + 12, w: 12, h: 8, solid: true }, o); }
const once = id => !State.f['seen_' + id] && (State.f['seen_' + id] = 1);
function talkCycle(id, sets, o) {
  return function* () { const k = State.f['t_' + id] || 0; State.f['t_' + id] = k + 1; yield Act.say(sets[Math.min(k, sets.length - 1)], o); };
}
function savePoint(id, tx, ty, flavor) {
  return O(id, tx, ty, {
    w: 10, h: 6, draw: (x, y, t) => ART.save(x, y, t),
    talk: function* () { State.d.hp = State.d.maxhp; Snd.sfx('save'); yield Act.say([flavor, '{y}(HP restored. Progress saved.){/}']); State.save(Game.ow); }
  });
}
function exitTo(x, y, w, h, to, tx, ty, dir) { return { x, y, w, h, to, sx: tx * TS + 8, sy: ty * TS + 12, dir }; }
function* encounterFlow(o) {
  const ow = Game.ow;
  yield Act.run(() => { ow.emote(ow.player, '!'); Snd.sfx('encounter'); });
  yield Act.wait(28);
  const res = yield Act.battle(o.enc);
  State.f[o.enc] = res; ow.refresh();
}

const Action = {
  reset(ow) { ow.foes = []; ow.shots = []; ow.drops = []; ow.parts = []; ow.arenaRun = null; const p = ow.player; p.swing = null; p.charging = false; p.chargeT = 0; p.kb = null; p.inv = 0; p.holding = null; },
  freeSpot(ow, x, y, r) {
    if (!this.blockedFoe(ow, x, y, r)) return [x, y];
    for (let d = 4; d < 80; d += 4) for (let k = 0; k < 16; k++) { const a = k / 16 * TAU, nx = x + Math.cos(a) * d, ny = y + Math.sin(a) * d; if (!this.blockedFoe(ow, nx, ny, r)) return [nx, ny]; }
    return [x, y];
  },
  spawnFoe(ow, kind, x, y, o = {}) { const D = FOES[kind]; [x, y] = this.freeSpot(ow, x, y, D.r + 1); const f = Object.assign({ kind, x, y, hp: D.hp, maxhp: D.hp, t: 0, hurt: 0, z: 0, hits: new Set() }, o); D.init && D.init(f); ow.foes.push(f); return f; },
  blockedFoe(ow, x, y, r) {
    for (const [cx, cy] of [[x - r, y - r], [x + r, y - r], [x - r, y], [x + r, y]]) if (solidTile(ow.tileAt(Math.floor(cx / TS), Math.floor(cy / TS)))) return true;
    for (const o of ow.all()) { if (!o.solid) continue; const b = ow.rectOf(o); if (x + r > b.x && x - r < b.x + b.w && y > b.y && y - r < b.y + b.h) return true; }
    return false;
  },
  moveFoe(ow, f, dx, dy) { let ok = true; const r = FOES[f.kind].r; if (!this.blockedFoe(ow, f.x + dx, f.y, r)) f.x += dx; else ok = false; if (!this.blockedFoe(ow, f.x, f.y + dy, r)) f.y += dy; else ok = false; return ok; },
  shoot(ow, x, y, vx, vy, dmg, kind) { ow.shots.push({ x, y, vx, vy, dmg, kind, t: 0 }); },
  hurtPlayer(ow, dmg, sx, sy) {
    const p = ow.player; if (p.inv > 0 || Game.god) return;
    if (hasPow('thimble')) dmg = Math.max(1, Math.ceil(dmg / 2));
    State.d.hp = Math.max(0, State.d.hp - dmg); p.inv = 70; ow.hudT = 240; Snd.sfx('hurt'); Game.shake = 4; buzz(30);
    const a = Math.atan2(p.y - sy, p.x - sx); p.kb = { x: Math.cos(a) * 2.6, y: Math.sin(a) * 2.6, n: 10 }; p.swing = null; p.charging = false;
    if (State.d.hp <= 0) ow.die();
  },
  swing(ow) { const p = ow.player; if (p.swing || p.kb) return; p.swing = { t: 0, dur: 14, id: Math.random(), spin: false }; p.charging = hasPow('charge'); p.chargeT = 0; Snd.sfx('swing'); },
  spin(ow) { const p = ow.player; p.swing = { t: 0, dur: 26, id: Math.random(), spin: true }; Snd.sfx('spin'); },
  dmg() { return hasPow('darning') ? 2 : 1; },
  update(ow) {
    const p = ow.player;
    if (p.inv > 0) p.inv--; if (ow.hudT > 0) ow.hudT--;
    if (p.kb) { ow.tryMove(p, p.kb.x, 0); ow.tryMove(p, 0, p.kb.y); if (--p.kb.n <= 0) p.kb = null; }
    if (p.charging) {
      if (Input.held.a) { p.chargeT++; if (p.chargeT === 40) Snd.sfx('charge'); }
      else { if (p.chargeT >= 40) this.spin(ow); p.charging = false; p.chargeT = 0; }
    }
    if (p.swing) {
      const s = p.swing; s.t++;
      const v = DIRV[p.dir], hx = p.x + (s.spin ? 0 : v[0] * 13), hy = p.y - 6 + (s.spin ? 0 : v[1] * 12), hr = s.spin ? 23 : 11;

function drawMotes(t, n, col, seed = 3) { const r = seeded(seed); for (let i = 0; i < n; i++) { const x = (r() * W + Math.sin(t * 0.01 + i) * 10) % W, y = ((r() * H - t * (0.1 + r() * 0.25)) % H + H) % H; G.globalAlpha = 0.5; px(x, y, col); G.globalAlpha = 1; } }
function panel(x, y, w, h) { R(x, y, w, h, '#000'); frame(x, y, w, h, '#fff', 2); }

class Title {
  constructor() { this.t = 0; this.stage = Platform.mode ? 'press' : 'platform'; this.sel = 0; this.jb = null; this.opts = []; this.psel = Platform.guess() === 'pc' ? 1 : 0; }
  enter() { Game.fade = 0; Snd.music.play('undercouch'); }
  menuOpts() { const c = 'CONTROLS: ' + (Platform.pc ? 'PC' : 'MOBILE'); const o = State.hasSave() ? ['CONTINUE', 'NEW GAME'] : ['NEW GAME']; if (Store.get('leftover.cleared')) o.push('BOSS RUSH'); return o.concat(['JUKEBOX', c]); }
  platRect(i) { return { x: i ? 166 : 38, y: 104, w: 116, h: 92 }; }
  update() {
    this.t++;
    if (this.jb) { this.jb.update(); if (this.jb.done) { this.jb = null; Snd.music.play('undercouch'); } return; }
    if (this.stage === 'platform') {
      if ((Input.nav('left') || Input.nav('up')) && this.psel) { this.psel = 0; Snd.sfx('blip'); }
      if ((Input.nav('right') || Input.nav('down')) && !this.psel) { this.psel = 1; Snd.sfx('blip'); }
      const tp = Input.tap(); let go = Input.pressed.a;
      if (tp) for (let i = 0; i < 2; i++) if (inRect(tp, this.platRect(i))) { this.psel = i; go = true; }
      if (go) { Snd.sfx('select'); Platform.set(this.psel ? 'pc' : 'mobile'); this.stage = 'menu'; this.opts = this.menuOpts(); this.sel = 0; }
      return;
    }
    if (this.stage === 'press') { if (Input.pressed.a || Input.tapped()) { Snd.sfx('select'); this.stage = 'menu'; this.opts = this.menuOpts(); } return; }
    if (this.stage === 'go') { this.goT++; Game.fade = this.goT / 30; if (this.goT >= 30) this.goFn(); return; }
    const n = this.opts.length;
    if (Input.nav('up')) { this.sel = (this.sel + n - 1) % n; Snd.sfx('blip'); }
    if (Input.nav('down')) { this.sel = (this.sel + 1) % n; Snd.sfx('blip'); }
    const tp = Input.tap(); if (tp) for (let i = 0; i < n; i++) if (inRect(tp, { x: 84, y: 146 + i * 16 - 4, w: 152, h: 16 })) { this.sel = i; this.pick(); return; }
    if (Input.pressed.a) this.pick();
  }
  pick() {
    const o = this.opts[this.sel]; Snd.sfx('select');
    if (o === 'JUKEBOX') { this.jb = new Jukebox(); return; }
    if (o === 'BOSS RUSH') { this.stage = 'go'; this.goT = 0; Snd.music.stop(0.8); this.goFn = () => Game.set(new BossRush()); return; }
    if (o.startsWith('CONTROLS')) { this.stage = 'platform'; this.psel = Platform.pc ? 1 : 0; return; }
    this.stage = 'go'; this.goT = 0; Snd.music.stop(0.8);
    this.goFn = o === 'CONTINUE' ? () => Game.continueGame() : () => { State.newGame(); Game.set(new Intro()); };
  }
  drawPlatform() {
    txt('HOW WILL YOU PLAY?', 160, 92, '#e8d9b8', 8, 'center');
    for (let i = 0; i < 2; i++) {
      const r = this.platRect(i), on = this.psel === i, c = on ? TC.y : '#8f84a0';
      R(r.x, r.y, r.w, r.h, 'rgba(0,0,0,0.7)'); frame(r.x, r.y, r.w, r.h, c, 2);
      const cx = r.x + r.w / 2;
      if (i === 0) {
        R(cx - 15, r.y + 10, 30, 50, '#2a1f33'); frame(cx - 15, r.y + 10, 30, 50, c, 1); R(cx - 11, r.y + 14, 22, 17, '#3d344b');
        R(cx - 9, r.y + 41, 7, 2, c); R(cx - 6.5, r.y + 38.5, 2, 7, c); ell(cx + 5, r.y + 44, 2, 2, c); ell(cx + 9, r.y + 40, 2, 2, c);
        txt('MOBILE', cx, r.y + 66, on ? TC.y : '#fff', 8, 'center'); txt('TOUCH PAD', cx, r.y + 78, '#8f84a0', 8, 'center');
      } else {
        const key = (x, y, w, l) => { R(x, y, w, 13, '#2a1f33'); frame(x, y, w, 13, c, 1); if (l) txt(l, x + w / 2, y + 3, on ? TC.y : '#e8d9b8', 8, 'center'); };
        key(cx - 7, r.y + 10, 14, 'W'); key(cx - 22, r.y + 25, 14, 'A'); key(cx - 7, r.y + 25, 14, 'S'); key(cx + 8, r.y + 25, 14, 'D'); key(cx - 40, r.y + 44, 80, 'SPACE');
        txt('PC', cx, r.y + 66, on ? TC.y : '#fff', 8, 'center'); txt('KEYBOARD', cx, r.y + 78, '#8f84a0', 8, 'center');
      }
      if (on) blit(SPR.heart, r.x + 6, r.y + 6);
    }
    txt('A / D  or  TAP  to choose', 160, 204, '#5a4f6c', 8, 'center');
  }
  draw() {
    const t = this.t;
    if (this.jb) { this.jb.draw(); return; }
    for (let y = 0; y < H; y += 4) { const k = y / H; R(0, y, W, 4, `rgb(${Math.round(14 + k * 18)},${Math.round(10 + k * 10)},${Math.round(20 + k * 22)})`); }
    for (let x = 0; x < W; x += 8) R(x, 0, 6, 10 + (x % 16 ? 2 : 0), '#2a1f33');
    R(0, 0, W, 6, '#3a2a44');
    drawMotes(t, 40, '#a59dbb');
    txtS('LEFTOVER', 160, 46, '#f2ece0', 24, 'center', '#d9434e');
    for (let x = 66; x < 256; x += 7) R(x, 78, 4, 2, '#d9434e');
    if (this.stage === 'platform') { this.drawPlatform(); return; }
    txt('AN UNDERCOUCH STORY', 160, 88, '#8f84a0', 8, 'center');
    const bob = Math.sin(t * 0.06) * 3; ART.shadow(160, 150, 14);
    G.save(); G.translate(160 - 21, 102 + bob); G.scale(3, 3); G.drawImage(SPR.sock_down, 0, 0); G.restore();
    if (this.stage === 'press') { if (Math.floor(t / 30) % 2 === 0) txt(Platform.pc ? 'PRESS SPACE TO START' : 'TAP TO START', 160, 176, '#ffe14d', 8, 'center'); }
    else {
      R(76, 138, 168, this.opts.length * 16 + 12, 'rgba(0,0,0,0.78)');
      this.opts.forEach((o, i) => { const y = 145 + i * 16; txt(o, 104, y, i === this.sel ? TC.y : '#fff'); if (i === this.sel) blit(SPR.heart, 88, y); });
    }
    if (this.stage === 'press') txt('ORIGINAL GAME + MUSIC', 160, 226, '#5a4f6c', 8, 'center');
  }
}

class Jukebox {
  constructor() { this.sel = 0; this.playing = null; this.done = false; this.t = 0; }
  update() {
    this.t++; Snd.music.decay(); const n = JUKEBOX.length;
    if (Input.nav('up')) { this.sel = (this.sel + n - 1) % n; Snd.sfx('blip'); }
    if (Input.nav('down')) { this.sel = (this.sel + 1) % n; Snd.sfx('blip'); }
    if (Input.pressed.b) { Snd.sfx('back'); this.done = true; return; }
    const tp = Input.tap();
    if (tp) { if (tp.y > 214) { this.done = true; return; } for (let i = 0; i < n; i++) if (inRect(tp, { x: 10, y: 26 + i * 13 - 3, w: 200, h: 13 })) { this.sel = i; this.play(); return; } }
    if (Input.pressed.a) this.play();
  }
  play() { const id = JUKEBOX[this.sel]; this.playing = id; Snd.sfx('select'); Snd.music.play(id, id === 'disco' ? { order: 'full', restart: true } : { restart: true }); }
  draw() {
    R(0, 0, W, H, '#0e0a14'); txt('JUKEBOX', 16, 10, '#ffe14d', 8);
    txt(Platform.key('back') + ': BACK', 304, 10, '#8f84a0', 8, 'right');
    JUKEBOX.forEach((id, i) => {
      const tr = Snd.music.TRACKS[id]; const y = 26 + i * 13; const on = i === this.sel;
      if (on) blit(SPR.heart, 14, y); txt(tr.title, 28, y, this.playing === id ? TC.y : on ? '#fff' : '#b8aec8');
      if (tr.boss) txt('BOSS', 304, y, '#ff4d5a', 8, 'right');
    });
    const tr = Snd.music.TRACKS[JUKEBOX[this.sel]]; R(0, 198, W, 42, '#1a1224');
    txt(tr.desc.toUpperCase(), 16, 204, '#8f84a0'); txt(`${tr.bpm} BPM`, 16, 220, '#5a4f6c');
    const L = Snd.music.levels; ['lead', 'counter', 'arp', 'bass', 'drum'].forEach((k, i) => { const h = Math.round(L[k] * 26); R(220 + i * 18, 232 - h, 12, h, ['#ff4d8a', '#ff9a3d', '#ffe14d', '#5ad8ff', '#7dff8a'][i]); });
  }
}

class Intro {
  constructor() { this.i = 0; this.t = 0; this.load(); }
  enter() { Game.fade = 1; Snd.music.play('undercouch', { bpm: 84, mute: ['drum'] }); }
  load() { this.pt = 0; this.tb = new TextBox([INTRO[this.i].t], { rect: { x: 24, y: 160, w: 272, h: 70 }, noBox: true, star: false, max: 32, voice: 'narr', speed: 0.8, noArrow: true }); }
  update() {
    this.t++; this.pt++;
    if (this.pt < 20) Game.fade = Math.max(0, 1 - this.pt / 20);
    if (Input.pressed.b && this.t > 20) { this.finish(); return; }
    if (this.leaving) { this.lt++; Game.fade = this.lt / 30; if (this.lt >= 30) this.start(); return; }
    this.tb.update();
    if (this.tb.done || (!this.tb.typing && this.tb.idle > 170)) { this.i++; if (this.i >= INTRO.length) this.finish(); else { Game.fade = 1; this.load(); } }
  }
  finish() { if (!this.leaving) { this.leaving = true; this.lt = 0; Snd.music.stop(1); } }
  start() { Game.newGameWorld(); }
  draw() { R(0, 0, W, H, '#000'); INTRO[Math.min(this.i, INTRO.length - 1)].pic(this.pt); frame(20, 20, 280, 130, '#2a2238', 2); this.tb.draw(); txt(Platform.key('back') + ': SKIP', 304, 228, '#3a3048', 8, 'right'); }
}

// ---------------- overworld menu ----------------
function pennyHint() {
  const f = State.f;
  if (!hasPow('needle')) return ['Heads says: open the chest in the Lint Fields.', 'There is a NEEDLE in it.^ It is pointy. You will like it.'];
  if (!f.dustbun) return ['Heads says: head east.^ Everything good is east. Usually.'];
  if (!f.toast) return ['Heads says: the Crumb Gate is north of Crumbtown.', 'TWIST sells snacks, if you want to stock up first.'];
  if (!f.disco) return ['Heads says: the Discotheque star is a diva.', 'Divas need an audience.^ Try dancing!'];
  if (!f.rumbah) return ['Heads says: RUMBAH is past the cathedral.', 'Gods love a CHECK-up.^ ...That was a hint. I am very good at hints.'];
  if (!f.sproing) return ['Heads says: GENERAL SPROING is wound WAY too tight.', 'Make him laugh a little first.^ Then help him UNWIND.'];
  return ['Heads says: you already know what to do.^ You always did.'];
}
class OverMenu {
  constructor(ow) { this.ow = ow; this.sel = 0; this.mode = 'main'; this.done = false; this.isel = 0; this.asel = 0; this.tb = null; this.opts = State.f.penny && !State.f.pennyLeft ? ['ITEM', 'STAT', 'FLIP'] : ['ITEM', 'STAT']; }
  say(pages, o = {}) { this.tb = new TextBox(pages, Object.assign({ top: this.ow.playerScreenY() > 138 }, o)); }
  update() {
    if (this.tb) { this.tb.update(); if (this.tb.done) { this.tb = null; if (this.closeAfter) this.done = true; } return; }
    const tp = Input.tap();
    if (this.mode === 'main') {
      const n = this.opts.length;
      if (Input.nav('up')) { this.sel = (this.sel + n - 1) % n; Snd.sfx('blip'); }
      if (Input.nav('down')) { this.sel = (this.sel + 1) % n; Snd.sfx('blip'); }
      if (Input.pressed.b || Input.pressed.menu) { this.done = true; return; }
      let go = Input.pressed.a;
      if (tp) { let hit = false; for (let i = 0; i < n; i++) if (inRect(tp, { x: 8, y: 84 + i * 16, w: 76, h: 16 })) { this.sel = i; go = true; hit = true; } if (!hit && tp.x > 90 && !this.panelHit(tp)) { this.done = true; return; } }
      if (go) {
        Snd.sfx('select'); const o = this.opts[this.sel];
        if (o === 'ITEM') { if (!State.d.items.length) { Snd.sfx('error'); return; } this.mode = 'item'; this.isel = 0; }
        else if (o === 'STAT') this.mode = 'stat';
        else { Snd.sfx('flip'); this.closeAfter = true; this.say(pennyHint().concat(['In fights: ACT until the MERCY bar fills, then SPARE.']), PN); }
      }
      return;
    }
    if (this.mode === 'stat') { if (Input.pressed.a || Input.pressed.b || tp) this.mode = 'main'; return; }
    if (this.mode === 'item') {
      const n = State.d.items.length; if (!n) { this.mode = 'main'; return; }
      if (Input.nav('up')) { this.isel = (this.isel + n - 1) % n; Snd.sfx('blip'); }
      if (Input.nav('down')) { this.isel = (this.isel + 1) % n; Snd.sfx('blip'); }
      if (Input.pressed.b) { this.mode = 'main'; return; }
      if (tp) for (let i = 0; i < n; i++) if (inRect(tp, { x: 96, y: 18 + i * 16, w: 200, h: 16 })) { this.isel = i; this.mode = 'iact'; this.asel = 0; Snd.sfx('select'); return; }
      if (Input.pressed.a) { this.mode = 'iact'; this.asel = 0; Snd.sfx('select'); }
      return;
    }
    if (this.mode === 'iact') {
      if (Input.nav('left')) { this.asel = (this.asel + 2) % 3; Snd.sfx('blip'); }
      if (Input.nav('right')) { this.asel = (this.asel + 1) % 3; Snd.sfx('blip'); }
      if (Input.pressed.b) { this.mode = 'item'; return; }
      if (tp) for (let i = 0; i < 3; i++) if (inRect(tp, { x: 104 + i * 64, y: 128, w: 60, h: 16 })) { this.asel = i; this.doItem(); return; }
      if (Input.pressed.a) this.doItem();
    }
  }
  panelHit(tp) { return tp.x < 304 && tp.y < 150; }
  doItem() {
    const id = State.d.items[this.isel]; const it = ITEMS[id]; Snd.sfx('select');
    if (this.asel === 0) { State.d.items.splice(this.isel, 1); const h = State.heal(it.heal); Snd.sfx('heal'); this.mode = 'main'; this.say([it.use, State.d.hp >= State.d.maxhp ? '{g}Your HP was maxed out.{/}' : `{g}You recovered ${h} HP!{/}`]); }
    else if (this.asel === 1) { this.mode = 'item'; this.say([`"${it.name}" - ${it.info}`]); }
    else { State.d.items.splice(this.isel, 1); this.mode = 'main'; this.say([`You left the ${it.name} behind.^ It will be very happy down here.`]); }
  }
  draw() {
    const d = State.d;
    panel(8, 8, 76, 70); txt('LEFT', 16, 16); txt('HP', 16, 34, '#8f84a0'); txt(`${d.hp}/${d.maxhp}`, 34, 34); txt('C', 16, 50, '#8f84a0'); txt(`${d.coins}`, 34, 50, TC.y);
    panel(8, 80, 76, this.opts.length * 16 + 10);
    this.opts.forEach((o, i) => { txt(o, 26, 88 + i * 16, this.mode === 'main' && i === this.sel ? TC.y : '#fff'); if (this.mode === 'main' && i === this.sel) blit(SPR.heart, 13, 88 + i * 16); });
    if (this.mode === 'stat') {
      panel(92, 8, 220, 150);
      txt('"LEFT"', 104, 18); txt(`HP   ${d.hp} / ${d.maxhp}`, 104, 40); txt(`ATK  ${playerAtk()}`, 104, 56); txt(`COINS ${d.coins}`, 104, 72, TC.y);
      txt('WEAPON: ' + (hasPow('darning') ? 'Darning Needle' : hasPow('needle') ? 'Needle' : 'Elastic cuff'), 104, 90, '#b8aec8'); txt('ARMOR: ' + (hasPow('thimble') ? 'Thimble' : 'Cotton blend'), 104, 104, '#b8aec8');
      txt(`SPOOLS ${(State.d.pow && State.d.pow.spools) || 0}/3` + (hasPow('charge') ? '   STATIC' : ''), 104, 118, '#b8aec8');
      txt(`SPARED ${d.spared}`, 104, 138, '#7dff8a'); txt(`UNRAVELED ${d.killed}`, 196, 138, d.killed ? TC.r : '#5a4f6c');
    }
    if (this.mode === 'item' || this.mode === 'iact') {
      panel(92, 8, 220, 150);
      d.items.forEach((id, i) => { const y = 18 + i * 16; txt(ITEMS[id].name, 112, y, i === this.isel ? TC.y : '#fff'); if (i === this.isel && this.mode === 'item') blit(SPR.heart, 98, y); });
      if (this.mode === 'iact') ['USE', 'INFO', 'DROP'].forEach((o, i) => { const x = 116 + i * 64; txt(o, x, 132, i === this.asel ? TC.y : '#fff'); if (i === this.asel) blit(SPR.heart, x - 13, 132); });
    }
    if (this.tb) this.tb.draw();
  }
}

// ---------------- shop ----------------
const SHOP_POWERS = { thimble: { name: 'Thimble', price: 20, info: 'A tiny shield. Blocks spit, halves bumps, softens battle hits.', power: 1 } };
const shopInfo = id => ITEMS[id] || SHOP_POWERS[id];
Act.shop = (list, o) => ({
  start() { this.sel = 0; this.msg = "What'll it be?"; },
  update() {
    const n = list.length + 1;
    if (Input.nav('up')) { this.sel = (this.sel + n - 1) % n; Snd.sfx('blip'); }
    if (Input.nav('down')) { this.sel = (this.sel + 1) % n; Snd.sfx('blip'); }
    if (Input.pressed.b) { Snd.sfx('back'); return true; }
    const tp = Input.tap(); let go = Input.pressed.a;
    if (tp) for (let i = 0; i < n; i++) if (inRect(tp, { x: 16, y: 22 + i * 18 - 4, w: 170, h: 18 })) { this.sel = i; go = true; }
    if (!go) return;
    if (this.sel === list.length) { Snd.sfx('back'); return true; }
    const id = list[this.sel], it = shopInfo(id);
    if (it.power && hasPow(id)) { this.msg = "You already have one.^ It's a very small shield. One is plenty."; Snd.sfx('error'); }
    else if (State.d.coins < it.price) { this.msg = 'Not enough coins, sock.'; Snd.sfx('error'); }
    else if (it.power) { State.d.coins -= it.price; givePow(id); this.msg = 'A THIMBLE! Wear it with pride.^ Or on your toe. Your whole body is a toe.'; Snd.sfx('gift'); }
    else if (State.d.coins < it.price) { this.msg = 'Not enough coins, sock.'; Snd.sfx('error'); }
    else if (State.d.items.length >= MAX_ITEMS) { this.msg = "Your pockets are full.^ You don't have pockets."; Snd.sfx('error'); }
    else { State.d.coins -= it.price; State.addItem(list[this.sel]); this.msg = pick(['Pleasure doing business.', "Enjoy. Don't share.", 'Fresh from under the cushion.', 'Stay twisted.']); Snd.sfx('coin'); }
  },
  draw() {
    panel(8, 8, 304, 150);
    list.forEach((id, i) => { const y = 22 + i * 18; const it = shopInfo(id); const on = this.sel === i; const sold = it.power && hasPow(id); txt(it.name, 30, y, sold ? '#5a4f6c' : on ? TC.y : '#fff'); txt(sold ? 'SOLD' : `${it.price}C`, 180, y, sold ? '#5a4f6c' : '#ffe14d', 8, 'right'); if (on) blit(SPR.heart, 14, y); });
    const ey = 22 + list.length * 18; txt('Exit', 30, ey, this.sel === list.length ? TC.y : '#fff'); if (this.sel === list.length) blit(SPR.heart, 14, ey);
    R(194, 14, 2, 138, '#3a3048');
    if (this.sel < list.length) { const info = shopInfo(list[this.sel]).info; const lines = wrapGlyphs(parseRich(info), 13, 0); lines.forEach((l, i) => txt(l.map(g => g.ch).join(''), 202, 22 + i * 14, '#b8aec8')); }
    txt(`COINS ${State.d.coins}`, 202, 136, TC.y);
    panel(8, 166, 304, 66); txt('TWIST', 18, 176, TC.y); const ml = wrapGlyphs(parseRich(this.msg), 34, 0); ml.forEach((l, i) => txt(l.map(g => g.ch).join(''), 18, 194 + i * 14));
  }
});

// ---------------- game over ----------------
class GameOver {
  constructor(b) { this.b = b; this.t = 0; this.sel = 0; this.tb = null; }
  enter() { Game.fade = 0; Snd.music.play('unraveled'); }
  update() {
    this.t++;
    if (this.t === 70) this.tb = new TextBox(["Get up, Lefty.", 'You survived the spin cycle.^ You can survive this.'], { rect: { x: 40, y: 120, w: 240, h: 50 }, noBox: true, star: false, max: 28, voice: 'penny', lines: 2 });
    if (this.tb && !this.tb.done) { this.tb.update(); return; }
    if (!this.tb) return;
    if (Input.nav('left') || Input.nav('right')) { this.sel ^= 1; Snd.sfx('blip'); }
    const tp = Input.tap(); let go = Input.pressed.a;
    if (tp) { if (tp.x < 160) this.sel = 0; else this.sel = 1; go = true; }
    if (go) {
      Snd.sfx('select');
      if (this.sel === 0 && !this.b) Game.retryFromSave();
      else if (this.sel === 0) { State.d.hp = State.d.maxhp; State.d.items = this.b.snap.items.slice(); Game.set(new Battle(this.b.id, this.b.opts, this.b.cb)); }
      else Game.toTitle();
    }
  }
  draw() {
    R(0, 0, W, H, '#000'); const t = this.t;
    const k = Math.min(1, t / 60); G.globalAlpha = k; txtS('UNRAVELED', 160, 52, '#d9434e', 24, 'center', '#3a0a10'); G.globalAlpha = 1;
    for (let i = 0; i < 30; i++) { const x = 70 + i * 6; const y = 84 + Math.sin(i * 0.7 + t * 0.03) * 3 + Math.max(0, (i - 15)) * k * 1.5; px(x, y, '#d9434e'); px(x + 2, y + 1, '#d9434e'); }
    if (this.tb) this.tb.draw();
    if (this.tb && this.tb.done) { ['RETRY', 'GIVE UP'].forEach((o, i) => { const x = i ? 196 : 76; txt(o, x, 190, i === this.sel ? TC.y : '#fff'); if (i === this.sel) blit(SPR.heart, x - 14, 190); }); }
  }
}

    const epi = (key, sp, ki, art) => { const o = f[key]; if (!o) return; P.push({ t: o === 'spared' ? sp : ki, pic: t => { R(20, 20, 280, 130, o === 'spared' ? '#1f1a2e' : '#0c0a10'); if (o === 'spared') art(160, 110, t); else { G.globalAlpha = 0.35; art(160, 110, t); G.globalAlpha = 1; } } }); };
    epi('toast', 'SIR TOASTWELL was found during spring cleaning.^ He toasts every morning now. Setting four. He has never been prouder.', 'Nobody ever found the toaster.^ Breakfast has been cereal ever since.', (x, y, t) => ART.toastwell(x, y, t));
    epi('disco', 'DISCO DISCORDIA was polished and played at a birthday party.^ She finished every song. Twice.', 'Somewhere under the couch, a disc lies silent.^ It never skips now.', (x, y, t) => ART.discordia(x, y, t));
    epi('rumbah', 'RUMBAH found its dock. Battery: 100%.^ The acolytes say it ascended.', 'The acolytes still pray to a machine that will never wake up.', (x, y, t) => ART.rumbah(x, y, t));
    epi('sproing', 'GENERAL SPROING was found when the couch got flipped for cleaning.^ He is a pogo stick now. He has never been happier.', 'The cushion never quite sits right anymore.^ Nobody knows why.', (x, y, t) => ART.sproing(x, y, t, f.sproing === 'spared'));
    P.push({ t: 'PENNY stayed in the Undercouch.^ Somebody has to welcome the new ones.^ Heads, every time.', pic: t => { R(20, 20, 280, 130, '#2a1f33'); ART.penny(160, 110, t, 0); } });
    this.pages = P;
    this.title = paired ? (d.killed === 0 ? 'THE TRUE PAIR ENDING' : 'THE PAIRED ENDING') : 'THE SINGLE SOCK ENDING';
    this.load();
  }
  enter() { Game.fade = 1; Snd.music.play(this.res === 'spared' ? 'paired' : 'unraveled'); Store.set('leftover.cleared', 1); }
  load() { this.pt = 0; if (this.i < this.pages.length) this.tb = new TextBox([this.pages[this.i].t], { rect: { x: 24, y: 160, w: 272, h: 70 }, noBox: true, star: false, max: 32, speed: 0.8, noArrow: true }); else this.tb = null; }
  update() {
    this.t++; this.pt++;
    if (this.pt <= 24) Game.fade = Math.max(0, 1 - this.pt / 24);
    if (this.tb) { this.tb.update(); if (this.tb.done || (!this.tb.typing && this.tb.idle > 220)) { this.i++; this.load(); } return; }
    if (this.pt > 90 && (Input.pressed.a || Input.tapped())) Game.toTitle();
  }
  draw() {
    R(0, 0, W, H, '#000');
    if (this.tb) { this.pages[this.i].pic(this.pt); frame(20, 20, 280, 130, '#2a2238', 2); this.tb.draw(); return; }
    drawMotes(this.t, 30, '#ffd8a8');
    txtS('LEFTOVER', 160, 50, '#f2ece0', 24, 'center', '#d9434e');
    txt(this.title, 160, 92, TC.y, 8, 'center');
    if (this.res === 'spared') { blit(SPR.sock_down, 145, 112); blit(SPR.right_down, 161, 112); } else blit(SPR.sock_down, 153, 112);
    txt(State.outcomeText(), 160, 148, '#b8aec8', 8, 'center');
    txt('THANKS FOR PLAYING', 160, 172, '#fff', 8, 'center'); txt('BOSS RUSH UNLOCKED ON THE TITLE SCREEN', 160, 188, '#8f84a0', 8, 'center');
    if (this.pt > 90 && Math.floor(this.t / 30) % 2 === 0) txt(Platform.pc ? 'PRESS SPACE' : 'TAP TO CONTINUE', 160, 210, '#8f84a0', 8, 'center');
  }
}

// ---------------- boss rush ----------------
const RUSH = ['toastwell', 'discordia', 'rumbah', 'sproing', 'king'];
class BossRush {
  constructor() {
    this.i = 0; this.t = 0; this.stage = 'intro'; this.results = []; this.saved = State.d; this.best = Store.get('leftover.rushBest');
    State.d = Object.assign(State.fresh(), { hp: 50, maxhp: 50, coins: 0, items: ['drop', 'drop', 'mint', 'mint', 'crust', 'fry'], f: { tutMove: 1 }, pow: { needle: 1, thimble: 1, charge: 1, darning: 1, spools: 3 } });
  }
  enter() { Game.rush = this; Snd.music.play('scuffle', { bpm: 120, mute: ['lead', 'counter'] }); this.fadeT = 20; }
  fmt(ms) { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
  battleEnded(outcome) {
    this.results.push(outcome); this.i++; this.fadeT = 20; this.t = 0;
    if (this.i >= RUSH.length) { this.stage = 'done'; this.time = Date.now() - this.t0; if (!this.best || this.time < this.best) { this.best = this.time; Store.set('leftover.rushBest', this.time); this.newBest = 1; } Snd.music.play('paired'); }
    else { this.healed = State.heal(Math.ceil(State.d.maxhp * 0.5)); this.stage = 'between'; Snd.music.play('scuffle', { bpm: 120, mute: ['lead', 'counter'] }); }
  }
  fight() { if (!this.t0) this.t0 = Date.now(); this.stage = 'fight'; Snd.sfx('encounter'); Game.startBattle(RUSH[this.i], {}, () => { }); }
  abort() { State.d = this.saved; Game.rush = null; }
  update() {
    this.t++; if (this.fadeT > 0) { this.fadeT--; Game.fade = this.fadeT / 20; }
    if (this.t < 20) return;
    if (Input.pressed.b && this.stage !== 'done') { this.abort(); Game.toTitle(); return; }
    if (!(Input.pressed.a || Input.tapped())) return;
    Snd.sfx('select');
    if (this.stage === 'done') { this.abort(); Game.toTitle(); } else this.fight();
  }
  draw() {
    R(0, 0, W, H, '#0e0a14'); drawMotes(this.t, 30, '#5a4f6c', 4);
    txtS('BOSS RUSH', 160, 16, '#ffe14d', 16, 'center', '#3a2a10');
    RUSH.forEach((id, i) => {
      const y = 50 + i * 20, d = ENEMIES[id], res = this.results[i], cur = i === this.i && this.stage !== 'done';
      if (cur) { R(40, y - 5, 240, 18, '#2a1f33'); blit(SPR.heart, 48, y); }
      txt(d.name, 64, y, res ? '#8f84a0' : cur ? TC.y : '#fff');
      if (res) txt(res === 'spared' ? 'SPARED' : 'UNRAVELED', 274, y, res === 'spared' ? '#7dff8a' : TC.r, 8, 'right');
    });
    const el = this.t0 ? (this.stage === 'done' ? this.time : Date.now() - this.t0) : 0;
    txt(`HP ${State.d.hp}/${State.d.maxhp}`, 48, 158, '#fff'); txt(`TIME ${this.fmt(el)}`, 272, 158, '#fff', 8, 'right');
    if (this.best) txt(`BEST ${this.fmt(this.best)}`, 272, 172, '#8f84a0', 8, 'right');
    const go = Platform.pc ? 'SPACE' : 'TAP';
    if (this.stage === 'intro') { txt('Five bosses. One heart.', 160, 186, '#b8aec8', 8, 'center'); txt(`${go} TO BEGIN   ${Platform.key('back')}: QUIT`, 160, 210, Math.floor(this.t / 30) % 2 ? TC.y : '#fff', 8, 'center'); }
    else if (this.stage === 'between') { txt(`Stitched up: +${this.healed} HP`, 160, 186, '#7dff8a', 8, 'center'); txt(`${go}: NEXT BOSS   ${Platform.key('back')}: QUIT`, 160, 210, Math.floor(this.t / 30) % 2 ? TC.y : '#fff', 8, 'center'); }
    else if (this.stage === 'done') { txt(this.newBest ? 'NEW BEST TIME!' : 'RUSH COMPLETE!', 160, 186, TC.y, 8, 'center'); txt(`${go} TO RETURN`, 160, 210, '#fff', 8, 'center'); }
  }
}

// ===================== GAME CORE & BOOT =====================
const Game = {
  scene: null, ow: null, fade: 0, shake: 0, t: 0, god: false, rush: null,
  set(s) { this.scene = s; if (s.enter) s.enter(); },
  newGameWorld() { this.ow = new Overworld(); this.fade = 1; this.ow.load(State.d.room, State.d.x, State.d.y, 'down'); this.set(this.ow); },
  continueGame() { if (!State.load()) State.newGame(); this.ow = new Overworld(); this.ow.load(State.d.room, State.d.x, State.d.y, State.d.dir); this.fade = 1; this.ow.fadeIn = 20; this.set(this.ow); },
  toTitle() { if (this.rush) this.rush.abort(); this.ow = null; this.fade = 0; this.set(new Title()); },
  retryFromSave() { if (State.hasSave()) this.continueGame(); else { State.newGame(); this.newGameWorld(); } },
  startBattle(id, opts, cb) {
    const ow = this.ow; const sx = ow ? ow.player.x - Math.round(ow.cam.x) : 160, sy = ow ? ow.player.y - Math.round(ow.cam.y) - 8 : 120;
    this.set(new BattleIntro(id, opts, cb, sx, sy));
  },
  endBattle(outcome, cb, keepDark) {
    if (this.rush) { this.set(this.rush); this.fade = 1; this.rush.battleEnded(outcome); return; }
    this.set(this.ow); this.fade = 1;
    if (!keepDark) { this.ow.fadeIn = 20; this.ow.playRoomMusic(); }
    cb(outcome);
  },
  update() { this.t++; if (this.shake > 0) this.shake--; if (this.scene) this.scene.update(); },
};

function render() {
  G = ctx0; ctx0.setTransform(SCALE, 0, 0, SCALE, 0, 0); ctx0.imageSmoothingEnabled = false;
  ctx0.fillStyle = '#000'; ctx0.fillRect(0, 0, W, H);
  ctx0.save(); if (Game.shake) ctx0.translate(randi(-2, 2), randi(-2, 2));
  if (Game.scene) Game.scene.draw();
  ctx0.restore();
  if (Game.fade > 0.001) { ctx0.globalAlpha = clamp(Game.fade, 0, 1); ctx0.fillStyle = '#000'; ctx0.fillRect(0, 0, W, H); ctx0.globalAlpha = 1; }
}
let acc = 0, last = performance.now();
function loop(now) {
  const dt = Math.min(100, now - last); last = now; acc += dt; let n = 0;
  while (acc >= 1000 / 60 && n < 4) { Input.update(); try { Game.update(); } catch (err) { reportError(err); } Input.endFrame(); acc -= 1000 / 60; n++; }
  if (n === 4) acc = 0;
  try { render(); } catch (err) { reportError(err); }
  requestAnimationFrame(loop);
}
const errors = [];
function reportError(err) { if (errors.length < 20) { errors.push(String(err && err.stack || err)); console.error(err); } }

function fit() {
  const wrap = document.getElementById('screenwrap'); const r = wrap.getBoundingClientRect();
  let w = Math.floor(Math.min(r.width, r.height * 4 / 3)); w = Math.max(160, w); const h = Math.floor(w * 3 / 4);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 3); const s = clamp(Math.ceil(w * dpr / W), 1, 6);
  if (s !== SCALE || canvas.width !== W * s) { SCALE = s; canvas.width = W * s; canvas.height = H * s; }
}

function wireControls() {
  const cross = document.getElementById('cross');
  let padId = null;
  const padFrom = e => {
    const r = cross.getBoundingClientRect(); const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const d = {}; if (Math.hypot(dx, dy) > r.width * 0.1) { const a = Math.atan2(dy, dx); const o = Math.round(a / (Math.PI / 4)); const map = { 0: ['right'], 1: ['right', 'down'], 2: ['down'], 3: ['down', 'left'], 4: ['left'], '-4': ['left'], '-3': ['left', 'up'], '-2': ['up'], '-1': ['up', 'right'] }; for (const k of map[o]) d[k] = 1; }
    Input.setPad(d); cross.dataset.dir = Object.keys(d).join(' ');
  };
  cross.addEventListener('pointerdown', e => { e.preventDefault(); Input.onUnlockNow && Input.onUnlockNow(); padId = e.pointerId; try { cross.setPointerCapture(e.pointerId); } catch (_) { } padFrom(e); unlockAudio(); });
  cross.addEventListener('pointermove', e => { if (e.pointerId === padId) padFrom(e); });
  const endPad = e => { if (e.pointerId === padId) { padId = null; Input.setPad({}); cross.dataset.dir = ''; } };
  cross.addEventListener('pointerup', endPad); cross.addEventListener('pointercancel', endPad); cross.addEventListener('lostpointercapture', endPad);
  for (const [id, k] of [['bA', 'a'], ['bB', 'b'], ['bMenu', 'menu']]) {
    const el = document.getElementById(id); if (!el) continue;
    el.addEventListener('pointerdown', e => { e.preventDefault(); unlockAudio(); try { el.setPointerCapture(e.pointerId); } catch (_) { } Input.btnDown(k); el.classList.add('down'); });
    const up = () => { Input.btnUp(k); el.classList.remove('down'); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  const snd = document.getElementById('bSound');
  const sk = document.getElementById('soundK'), skb = document.getElementById('bSoundK');
  const setLabel = () => { snd.textContent = Snd.muted ? 'SOUND OFF' : 'SOUND ON'; snd.setAttribute('aria-pressed', String(!Snd.muted)); if (sk) sk.textContent = Snd.muted ? 'sound off' : 'sound on'; if (skb) skb.setAttribute('aria-pressed', String(!Snd.muted)); };
  snd.addEventListener('click', () => { unlockAudio(); toggleMute(); });
  if (skb) skb.addEventListener('click', () => { unlockAudio(); toggleMute(); skb.blur(); });
  window.toggleMute = () => { Snd.setMuted(!Snd.muted); Store.set('leftover.muted', Snd.muted); setLabel(); };
  if (Store.get('leftover.muted')) Snd.setMuted(true);
  setLabel();
  document.addEventListener('touchmove', e => { if (e.target.closest && e.target.closest('#app')) e.preventDefault(); }, { passive: false });
}
function unlockAudio() { Snd.init(); }
Input.onUnlock = unlockAudio;
Input.onMute = () => window.toggleMute && window.toggleMute();

function boot(hotData) {
  buildSprites(); Platform.onChange = () => requestAnimationFrame(fit); Platform.load();
  if (hotData && hotData.save) { State.d = hotData.save; }
  wireControls(); fit();
  addEventListener('resize', fit); if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  new ResizeObserver(fit).observe(document.getElementById('screenwrap'));
  Game.set(new Title());
  requestAnimationFrame(t => { last = t; loop(t); });
}
window.LEFTOVER = {
  Game, State, Snd, Input, ROOMS, ENEMIES, ATTACKS, errors,
  debug: {
    world(room = 'landing', tx, ty) { if (!State.d) State.newGame(); State.f.woke = 1; State.f.penny = 1; Game.ow = new Overworld(); const R = ROOMS[room]; Game.ow.load(room, tx !== undefined ? tx * TS + 8 : 10 * TS, ty !== undefined ? ty * TS + 12 : 8 * TS, 'down'); Game.fade = 0; Game.set(Game.ow); },
    battle(id) { if (!Game.ow) this.world(); Game.ow.run(function* () { const r = yield Act.battle(id); LEFTOVER.lastResult = r; }); },
    god(v = true) { Game.god = v; },
    step(n = 1, keys) { for (let i = 0; i < n; i++) { Input.update(); if (keys && i === 0) for (const k of keys) Input.press(k); Game.update(); Input.endFrame(); } render(); },
  },
  internals: { wrapGlyphs, parseRich, TextBox, Battle, Overworld, Script, Act, ITEMS, Ending, Title, Jukebox, Intro, GameOver, BossRush, Action, FOES, hasPow, givePow },
};
(function start() {
  const go = () => { const hot = window.claude && window.claude.hot; if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data); };
  let started = false; const once = () => { if (!started) { started = true; go(); } };
  try { document.fonts.load("8px 'PS2P'").then(once, once); } catch (e) { once(); }
  setTimeout(once, 1500);
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ save: State.d ? JSON.parse(JSON.stringify(State.d)) : null })); } catch (e) { }
})();

})();
</script>
